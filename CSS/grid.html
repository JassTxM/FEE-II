<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Grid Layout</title>
<style>
body {
    background: #181818;
    margin: 0;
    padding: 0;
}
.container {
    display: grid;

    gap: 20px;

    grid-template-columns: 2fr 1fr;
    grid-template-rows: 100px 220px 100px;
    width: 80vw;
    max-width: 900px;
    margin: 40px auto;

}
.box {
    background: #7ee7f8;
    min-height: 60px;
}


.box1 {
    grid-column: 1/3;
    grid-row: 1/2;
}
.box2 {
    grid-column: 1/2;
    grid-row: 2/4;
}
.box3 {
    grid-column: 2/3;
}
.box4 {
    grid-column: 2/3;
    grid-row: 2/3;
}
.box5 {
    grid-column: 1/3;
    grid-row: 4/5;
}
</style>
</head>
<body>
<div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
</div>
</body>
</html>
