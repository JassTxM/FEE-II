<!DOCTYPE html>
<html>
<head>
  <style>
    h1 {
      color: navy;
      font-family: Verdana;
    }
    p {
      color: green;
      font-size: 18px;
    }
  </style>
  <link rel="stylesheet" href="external.css">
</head>
<body>
  <h1>This heading uses internal CSS</h1>
  <p>This paragraph uses internal CSS.</p>
  
  <p style="color: red; font-weight: bold;">
    This paragraph uses inline CSS, overriding the internal style.
  </p>
</body>
</html>
