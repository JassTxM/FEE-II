<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Challenge 1</title>
</head>

<body>
    <form action="POST">
        <label for="name">Name: </label>
        <input type="text" name="name" id="name" placeholder="Enter you name" pattern="[A-Za-z]*" minlength="3">
        <br>
        <label for="email">E-Mail: </label>
        <input type="email" name="email" id="email" placeholder="Enter your E-Mail" required>
        <br>
        <label for="age">Age: </label>
        <input type="number" name="age" id="age" min="18" max="80" placeholder="Age">
        <br>
        <label for="phone">Phone Number: </label>
        <input type="tel" name="phone" id="phone" maxlength="10" placeholder="Enter contact details">
        <br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male">
        <label for="gender">Male</label>
        <input type="radio" name="gender" id="female">
        <label for="gender">Female</label>
        <input type="radio" name="gender" id="other">
        <label for="other">Other</label>
        <br>
        <label for="pass">Password:</label>
        <input type="password" placeholder="Enter your password" min="6" max="12">
        <br>
        <label for="confirm">Confirm Password: </label>
        <input type="text" placeholder="Confirm Password"  name="confirm" id="confirm">
        <br>
        <input type="submit">
    </form>
</body>

</html>
