<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
        background-color: antiquewhite;
    }

    .form{
        width: 50%;
        margin: auto auto;
        
    }
    .require{
        color: red;
        font-weight: bold;
    }

    #submit{
        background-color: green;
        font-size: large;
        border: 1px solid black;
        cursor: pointer;
    }
    #reset{
        background-color: red;
        font-size: large;
        border: 1px solid black;
        cursor: pointer;
    }

    label{
        padding-left: 10px;
        font-weight: bold;
    }

    legend{
        font-weight: bold;
    }
    

    </style>
</head>
<body>
    <form class="form" action="POST">
        <p class="require"><strong>Required field are denoted by '*'</strong></p>
        <fieldset>
            <legend>Personal Details</legend>
                <label for="First Name">First Name:* </label>
                <input type="text" name="First Name" placeholder="Enter your First Name" required>
            
                <label for="Last Name">Last Name:* </label>
                <input type="text" name="Last Name" placeholder="Enter your Last Name" required>
                <br>
                <br>
                <label for="DOB">Date of Birth (DOB)*: </label>
                <input type="date" name="DOB" required>

                <label for="age">Age*: </label>
                <input type="number" name="age" placeholder="Enter your Age" required>
        </fieldset>
        <br>
        <fieldset>
            <legend>Gender</legend>
              <input type="radio" name = "gender">
              <label for="gender">Male</label>
              <input type="radio" name = "gender">
              <label for="gender">Female</label>
              <input type="radio" name = "gender">
              <label for="gender">Other</label>
                
        </fieldset>
        <br>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="ph-num">Phone Number*: </label>
            <input type="tel" name="ph-num" placeholder="Enter your Phone Number" required>
            <label for="email">Email ID*: </label>
            <input type="email" name="email" placeholder="Enter your Email Address" required>

                
     </fieldset>
        <br>
        <fieldset>
            <legend>Address Details</legend>
                <label for="address">Address*: </label>
                <input type="text" name="address" placeholder="Enter your Address" required>
                <label for="city">City*: </label>
                <input type="text" name="city" placeholder="City" required>
                <br>
                <br>
                <label for="state">State*: </label>
                <input type="text" name="state" placeholder="State" required>
                <label for="pin">PinCode*: </label>
                <input type="text" name="pin" placeholder="PinCode" required>
        </fieldset>
        <br>
        <fieldset>
            <legend>Login Details</legend>
                <label for="username">Username*: </label>
                <input type="text" name="username" placeholder="Enter your Username" required>
                <br>
                <br>
                <label for="password">Password*: </label>
                <input type="password" name="password" placeholder="Enter your Password" required>

        </fieldset>
        <br>
        <input type="button"  name="submit" id="submit" value="Submit">
        <input type="reset" name="reset" id="reset" value="Reset">
    </form>
</body>
</html>
